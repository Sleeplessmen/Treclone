name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    name: Lint, build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: treclone
          POSTGRES_PASSWORD: treclone123
          POSTGRES_DB: treclone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treclone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://treclone:treclone123@localhost:5432/treclone
      JWT_SECRET: ci-jwt-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci # runs `postinstall` -> `prisma generate`

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

version: '3.8'

services:
  app:
    container_name: treclone-app
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
      - /app/.pnp
      - /app/.pnp.js
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/treclone?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development_secret_change_in_production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - db
      - redis
    networks:
      - treclone-network
    restart: unless-stopped

  db:
    container_name: treclone-db
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=treclone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - treclone-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: treclone-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - treclone-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    container_name: treclone-mailhog
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - treclone-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  treclone-network:
    driver: bridge
